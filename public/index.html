<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PortDrop</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div id="main-container">
            <h1 id="main-head">Welcome to PortDrop Service!</h1>
            <p>Just type or paste any text / link which you want to share over your Wi-Fi.</p>

            <form>
                <textarea placeholder="Type Your Text here..." rows="20" cols="50" id="textarea"></textarea>
                <p id="statusEl"></p>
                <button type="submit" id="sub-btn">Send Over Wi-Fi 🚀</button>
            </form>
        </div>

        <div id="message-container">
            <ul id="message-list"></ul>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
